# Global push-to-talk for IRIS on Hyprland (Omarchy).
# Add these lines to ~/.config/hypr/bindings.conf (or hyprland.conf) and reload Hyprland.
# Hold SUPER+F12 to talk, release to send. Pressing it while IRIS speaks interrupts her.
# `iris talk` must be running in a terminal.

bind  = SUPER, F12, exec, ~/.local/bin/iris ptt down
bindr = SUPER, F12, exec, ~/.local/bin/iris ptt up

# Optional: rate the last reply from anywhere
bind = SUPER SHIFT, F12, exec, ~/.local/bin/iris ptt good
bind = SUPER CTRL, F12, exec, ~/.local/bin/iris ptt bad
